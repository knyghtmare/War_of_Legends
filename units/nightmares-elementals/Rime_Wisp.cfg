#textdomain wesnoth-War_of_Legends

[unit_type]
    id=Rime Wisp
    name= _ "Rime Wisp"
    race=elemental
    image="units/meloen/rime_wisp.png"
    {TRAIT_ELEMENTAL}

    hitpoints=20
    movement_type=rime_wisp
    movement=8
    experience=26
    level=0
    alignment=neutral
    advances_to=Rime Wraith
    {AMLA_DEFAULT}
    cost=14
    usage=scout
    description= _ "A scrap of frost left behind when a greater fury burns itself out, the Rime Wisp is barely more than drifting cold given the vaguest sense of shape. It skitters just out of reach of anything that might harm it, and what little damage does land only slows it for a moment — the cold in it simply reforms, the way frost does on a windowpane no matter how many times it's wiped away."
    [abilities]
        {ABILITY_SELF_HEAL}
    [/abilities]

    die_sound=wail-long.wav
    {DEFENSE_ANIM "units/meloen/rime_wisp.png" "units/meloen/rime_wisp.png" wail-sml.wav }
    [attack]
        name="frost claws"
        description=_"frost claws"
        icon=attacks/claws.png
        type=blade
        range=melee
        damage=3
        number=3
        [specials]
            {WEAPON_SPECIAL_CHILL}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name="frost claws"
        [/filter_attack]
        start_time=-150

        [frame]
            image=units/meloen/rime_wisp.png:150
        [/frame]
        {SOUND:HIT_AND_MISS wail-sml.wav miss-1.ogg -100}
        [frame]
            image=units/meloen/rime_wisp.png:150
        [/frame]
    [/attack_anim]
[/unit_type]

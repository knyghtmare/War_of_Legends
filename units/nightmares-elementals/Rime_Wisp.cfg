#textdomain wesnoth-War_of_Legends

[unit_type]
    id=Rime Wisp
    name= _ "Rime Wisp"
    race=elemental
    image="units/meloen/rime_wisp.png"
    {TRAIT_ELEMENTAL}

    hitpoints=17
    movement_type=undeadspirit
    [resistance]
        impact=110
    [/resistance]
    movement=8
    experience=24
    level=0
    alignment=neutral
    advances_to=Rime Wraith
    {AMLA_DEFAULT}
    cost=13
    usage=scout
    description= _ "Ice ghosts are manifestations of magical energies that appear in cold and icy regions of Wesnoth."

    die_sound=wail-long.wav
    {DEFENSE_ANIM "units/meloen/rime_wisp.png" "units/meloen/rime_wisp.png" wail-sml.wav }
    [attack]
        name="frost claws"
        description=_"frost claws"
        icon=attacks/claws.png
        type=cold
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name="frost claws"
        [/filter_attack]
        start_time=-150

        [frame]
            image=units/meloen/rime_wisp.png:150
        [/frame]
        {SOUND:HIT_AND_MISS wail-sml.wav miss-1.ogg -100}
        [frame]
            image=units/meloen/rime_wisp.png:150
        [/frame]
    [/attack_anim]
[/unit_type]
